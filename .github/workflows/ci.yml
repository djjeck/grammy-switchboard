# The checks every change must pass: formatting, lint, types, the build, and the tests at 100%
# coverage. release.yml runs the same workflow before it publishes.
name: CI

on:
  push:
    # Branches only: a version tag runs these checks through release.yml instead.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
